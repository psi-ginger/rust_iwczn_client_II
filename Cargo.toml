[package]
name = "goonzu_client"
version = "0.1.0"
edition = "2021"
description = "Native Rust port of the GoonZu World client (1-1 OOP parity with GoonZu_Source)"

# Step 1.1 scope: minimal, high-performance dependencies only.
# - tokio: async runtime (rt/net/macros/time) for TCP sessions and tickers;
#   io-util added by Step 2.1 for AsyncReadExt/AsyncWriteExt (bounded reads);
#   signal added by Step 5.3 for tokio::signal::ctrl_c (graceful Ctrl+C
#   teardown) - still tokio-only as a direct dependency: no new crates of
#   our own, only the signal feature's transitive deps under tokio.
# - bytes: zero-copy wire buffers for framed packet codec
# - tracing / tracing-subscriber: structured protocol logging
# - thiserror: typed protocol/IO error definitions
[dependencies]
tokio = { version = "1", features = ["rt", "net", "macros", "time", "io-util", "signal"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"

[dev-dependencies]
# Step 5.1 / P-05 (QC directive): `tokio::time::pause` and
# `#[tokio::test(start_paused = true)]` need the `test-util` feature. Declared
# as a dev-dependency-only feature so resolver v2 keeps it out of release
# builds; the event-loop timing tests then run on tokio's virtual clock
# (deterministic, zero wall-clock flake surface).
tokio = { version = "1", features = ["test-util"] }
